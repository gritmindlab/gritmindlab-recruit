name: 채용정보 자동 수집

# 매시 정각마다 자동 실행 + 수동 실행 버튼도 사용 가능
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 패키지 설치
        run: npm install axios

      - name: 채용정보 수집 스크립트 실행
        run: node scripts/fetch-recruit.js
        env:
          DATAGO_SERVICE_KEY: ${{ secrets.DATAGO_SERVICE_KEY }}

      - name: 변경사항 자동 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/recruit.json
          git diff --staged --quiet || git commit -m "채용정보 자동 업데이트"
          git push
